<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeBook</title>

<!-- Open Graph (Facebook, LinkedIn, etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="RecipeBook - Apple Crisp">
<meta property="og:description" content="A simple yet delicious fall dessert recipe for apple crisp.">
<meta property="og:url" content="https://example.com/recipes.html">
<meta property="og:image" content="images/social-preview-image.png">

<!-- X Card -->
<meta name="twitter:card" content="Social Preview Image">
<meta name="twitter:title" content="RecipeBook - Apple Crisp">
<meta name="twitter:description" content="A simple yet delicious fall dessert recipe for apple crisp.">
<meta name="twitter:image" content="images/social-preview-image.png">

<!-- One favicon (ICO works everywhere) -->
<link rel="icon" href="/favicon.ico">
<!-- One Apple Touch Icon (iOS home screen) -->
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

<link rel="stylesheet" href="recipes.css">
<script src="recipes.js" defer></script>
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="images/recipe-book.png" alt="RecipeBook logo" class="logo-img">
      RECIPEBOOK
    </div>
    <div class="search-bar">
      <input id="search" type="text" placeholder="Find a recipe">
      <button id="search-button">
        <img src="images/search.svg" alt="search icon" class="search-icon">
      </button>
    </div>
  </header>

  <div 
    id="recipe-container">
  </div>

  <footer class="footer">
    <a href="#" class="credit">Recipe icons created by Freepik - Flaticon</a>
    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
  </footer>

</body>
</html>
